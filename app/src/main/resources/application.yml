kadr:
  data-dir: ${user.home}/.kadr
  model:
    id: siglip2-base-patch16-224
    dir: ${kadr.data-dir}/models/${kadr.model.id}
  # Defaults measured on a 2-core, 4-thread laptop CPU; see docs/mvp-plan.md, M1
  indexing:
    enabled: true
    decoding-threads: 2
    inference-threads: 0  # one per physical core, taken as half the processors
    batch-size: 16
    max-attempts: 3
    max-megapixels: 100
    idle-pause: 5s

spring:
  application:
    name: kadr
  datasource:
    # Spring closes the database on shutdown; H2's own shutdown hook would close it
    # before background work has stopped
    url: jdbc:h2:file:${kadr.data-dir}/catalog;DB_CLOSE_ON_EXIT=FALSE
  servlet:
    multipart:
      # An image to search by; larger uploads are answered 413
      max-file-size: 30MB
      max-request-size: 31MB
  mvc:
    problemdetails:
      enabled: true

server:
  address: 127.0.0.1
  port: 8080

management:
  endpoint:
    health:
      show-details: always
  health:
    diskspace:
      # Free space matters where the service writes
      path: ${kadr.data-dir}
